# Fixed port for apps run from the repo root: the unified Content Studio
# (streamlit run dashboard.py) and the standalone essays app (streamlit run
# app.py). Pinning it stops the app from drifting onto whatever port is
# free and colliding with other Streamlit apps on this machine.
# The standalone viral dashboard in viral-agents/ is pinned to 8502.

[server]
port = 8501

# Same dark Metis palette as viral-agents/.streamlit/config.toml, so the
# whole studio reads as one product: deep slate ground, muted bronze accent.
[theme]
base = "dark"
primaryColor = "#C9A227"
backgroundColor = "#0F1216"
secondaryBackgroundColor = "#191D23"
textColor = "#E8E8E6"
font = "sans serif"
